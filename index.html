<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>FloatCTF · Shadcn Console</title>
		<script>
			// 首屏主题脚本（docs/theme.md §11.4）：亮色默认，显式存过 dark 才进暗色。
			// 键名必须与 src/lib/theme.ts 的 STORAGE_KEY 一致。
			;(function () {
				try {
					var dark = localStorage.getItem('shadcn.theme') === 'dark'
					var root = document.documentElement
					root.classList.toggle('dark', dark)
					root.style.colorScheme = dark ? 'dark' : 'light'
				} catch (e) {
					/* localStorage 不可用：回退默认亮色 */
				}
			})()
		</script>
	</head>
	<body>
		<!--
			dev 入口：直接把本前端挂到 #root（与生产制品调用**同一个** mount(context)）。
			生产由 apps/web bootstrap 注入 #root 并动态 import 版本化制品。
		-->
		<div id="root"></div>
		<script type="module" src="/src/dev.tsx"></script>
	</body>
</html>
